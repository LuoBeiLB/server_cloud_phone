# =============================================================================
# 敏感配置「示例」—— 复制为 secret.yaml 后填真实值再 apply，切勿把真实口令提交进仓库
# -----------------------------------------------------------------------------
# 生产建议改用 External Secrets Operator / Vault / SealedSecrets 注入，不落明文。
#   cp secret.example.yaml secret.yaml && 编辑真实值
#   kubectl apply -f secret.yaml
#
# ⚠️ 一致性：CLOUD_DATABASE_URL 里的口令必须与 postgres.yaml 使用的 POSTGRES_PASSWORD 相同，
#    两处都引用本 Secret 的同一把 key（DB_PASSWORD），避免手抖不一致。
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: cloud-secret
  namespace: cloud-phone
  labels:
    app.kubernetes.io/part-of: cloud-phone
type: Opaque
stringData:
  # --- JWT 签名密钥（HS256）：务必用高熵随机串替换 ---
  CLOUD_JWT_SECRET: "REPLACE_WITH_STRONG_RANDOM_SECRET"

  # --- 初始管理员口令（首启动播种；上线后请在系统内改密并清空此项）---
  CLOUD_ADMIN_PASSWORD: "REPLACE_ADMIN_PASSWORD"

  # --- PostgreSQL 口令（postgres StatefulSet 与下面的 URL 共用）---
  DB_PASSWORD: "REPLACE_DB_PASSWORD"

  # --- 完整异步连接串（含口令）：口令段需与 DB_PASSWORD 保持一致 ---
  # 形如 postgresql+asyncpg://cloud:<DB_PASSWORD>@postgres:5432/cloud
  CLOUD_DATABASE_URL: "postgresql+asyncpg://cloud:REPLACE_DB_PASSWORD@postgres:5432/cloud"
