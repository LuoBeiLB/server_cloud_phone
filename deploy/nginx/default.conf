# nginx 反向代理 —— 前端静态资源 + /api、/api/ws 反代到后端
# 被 frontend/Dockerfile 拷贝到 /etc/nginx/conf.d/default.conf
# 端口约定：前端 nginx 80（宿主映射 5173）；后端 backend:8000
# ---------------------------------------------------------------------------

# WebSocket 升级所需：根据 Upgrade 头动态设置 Connection
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 后端地址。**刻意不用 upstream 块。**
#
# 坑：`upstream { server backend:8000; }` 只在配置加载时解析一次 DNS 并永久缓存。
# 只重新发布 backend（容器重建会拿到新 IP）而没重建 frontend 时，nginx 会一直连旧 IP，
# 导致所有 /api 永久 502 —— 而在旧版前端下（缺少全局错误提示）表现为「点击无反应」，
# 极难定位。改用「resolver + 变量形式 proxy_pass」，nginx 会按 TTL 重新解析。
#
# 127.0.0.11 是 Docker 内嵌 DNS，仅在 Docker 网络内有效。本文件由 frontend/Dockerfile
# 烤进前端镜像、只走 Docker 部署路径；宿主机直装 nginx 的部署（部署手册 §5.7）用的是
# 手册里另一份配置，不受此处影响。
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    # gzip 压缩静态资源
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    root /usr/share/nginx/html;
    index index.html;

    # --- API 反代（覆盖 /api 与 /api/ws；WS 也匹配此前缀）---
    # 单个 location 同时携带 Upgrade 头，HTTP 与 WebSocket 皆可工作。
    location /api/ {
        # 变量形式的 proxy_pass 是让 resolver 生效的关键：写成常量或 upstream 名
        # 都会让 nginx 在启动时把地址解析死。变量后不带 URI 时，nginx 按原样透传
        # 请求 URI（即 /api/... 完整保留），与原先 upstream 写法行为一致。
        set $cloud_backend backend:8000;
        proxy_pass http://$cloud_backend;
        proxy_http_version 1.1;

        # WebSocket 升级（/api/ws）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 常规透传头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WS 长连接：拉长读超时，禁用缓冲，保证预览帧实时
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # --- 构建产物：长缓存，且缺文件必须真 404 ---
    #
    # 坑（曾导致「重新发布后进入页面，点击操作无反应且不报错」）：
    # 路由是 hash 模式 + 全部懒加载（src/router/index.js），每个页面是带内容哈希的独立 chunk。
    # 浏览器若缓存了旧 index.html，它引用的 chunk 在新镜像里已经不存在；
    # 而下面 SPA 回退的 try_files 会把这个 404 变成 200 + index.html 的 HTML，
    # 浏览器拿 HTML 当 JS 解析报语法错 → 动态 import 静默失败 → 导航中止、点击毫无反应。
    # 所以 /assets/ 必须单独 location 并以 =404 收尾，绝不能落到 SPA 回退里。
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # --- 入口 HTML 绝不缓存 ---
    # 文件名不带哈希，一旦被缓存，重新发布后客户端仍会引用已消失的旧 chunk。
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # --- 前端单页应用（SPA）路由回退 ---
    # hash 模式下服务器其实只会收到 /，此回退仅为直接访问子路径时兜底。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
